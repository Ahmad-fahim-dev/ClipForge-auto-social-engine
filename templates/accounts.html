{% extends "base.html" %}
{% block title %}ClipForge — Accounts{% endblock %}

{% block content %}
<div class="top-bar">
    <div>
        <button class="mobile-menu-btn" onclick="toggleSidebar()" aria-label="Toggle menu">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </button>
        <div>
            <div class="page-title">Connected Accounts</div>
            <div class="page-subtitle">Link your social media accounts for auto-posting</div>
        </div>
    </div>
</div>

<div class="page-content">
    <div class="account-grid" id="account-list">
        <!-- YouTube -->
        <div class="account-card">
            <div class="account-icon-wrap yt-bg">
                <svg class="icon-svg xl" viewBox="0 0 24 24" style="fill:currentColor;stroke:none;">
                    <path d="M23.5 6.19a3 3 0 0 0-2.12-2.12C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.38.57A3 3 0 0 0 .5 6.19 31.3 31.3 0 0 0 0 12a31.3 31.3 0 0 0 .5 5.81 3 3 0 0 0 2.12 2.12C4.5 20.5 12 20.5 12 20.5s7.5 0 9.38-.57a3 3 0 0 0 2.12-2.12A31.3 31.3 0 0 0 24 12a31.3 31.3 0 0 0-.5-5.81zM9.75 15.02V8.98L15.5 12l-5.75 3.02z"></path>
                </svg>
            </div>
            <div class="account-platform">YouTube</div>
            <div class="account-status disconnected" id="yt-status">Not connected</div>
            <div id="yt-username-display" style="font-size:13px;color:var(--text-secondary);margin-bottom:12px;display:none;"></div>
            <div class="form-group" style="text-align:left;">
                <label>API Key</label>
                <input type="password" class="form-input" id="yt-api-key" placeholder="YouTube Data API v3 key">
            </div>
            <div class="form-group" style="text-align:left;">
                <label>Channel URL (optional)</label>
                <input type="text" class="form-input" id="yt-channel-url" placeholder="https://youtube.com/@channel">
            </div>
            <div style="display:flex;gap:8px;">
                <button class="btn btn-primary" id="yt-connect-btn" style="flex:1;" onclick="connectYouTube()">Connect</button>
                <button class="btn btn-secondary" id="yt-test-btn" onclick="testYouTube()" title="Test connection">
                    <svg class="icon-svg sm" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                </button>
                <button class="btn btn-danger" id="yt-disconnect-btn" style="display:none;" onclick="disconnectAccount('youtube')">
                    <svg class="icon-svg sm" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                </button>
            </div>
        </div>

        <!-- TikTok -->
        <div class="account-card">
            <div class="account-icon-wrap tt-bg">
                <svg class="icon-svg xl" viewBox="0 0 24 24" style="fill:currentColor;stroke:none;">
                    <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-2.88 2.5 2.89 2.89 0 0 1-2.89-2.89 2.89 2.89 0 0 1 2.89-2.89c.28 0 .55.04.81.1v-3.49a6.37 6.37 0 0 0-.81-.05A6.34 6.34 0 0 0 3.15 15a6.34 6.34 0 0 0 6.34 6.34 6.34 6.34 0 0 0 6.34-6.34V8.68a8.2 8.2 0 0 0 4.76 1.52v-3.45a4.83 4.83 0 0 1-1-.06z"></path>
                </svg>
            </div>
            <div class="account-platform">TikTok</div>
            <div class="account-status disconnected" id="tt-status">Not connected</div>
            <div id="tt-username-display" style="font-size:13px;color:var(--text-secondary);margin-bottom:12px;display:none;"></div>
            <div class="form-group" style="text-align:left;">
                <label>Username</label>
                <input type="text" class="form-input" id="tt-username" placeholder="Your TikTok username">
            </div>
            <div class="form-group" style="text-align:left;">
                <label>Session ID</label>
                <input type="password" class="form-input" id="tt-session-id" placeholder="Session ID from browser cookies">
            </div>
            <div style="display:flex;gap:8px;">
                <button class="btn btn-purple" id="tt-connect-btn" style="flex:1;" onclick="connectTikTok()">Connect</button>
                <button class="btn btn-secondary" id="tt-test-btn" onclick="testTikTok()" title="Test connection">
                    <svg class="icon-svg sm" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                </button>
                <button class="btn btn-danger" id="tt-disconnect-btn" style="display:none;" onclick="disconnectAccount('tiktok')">
                    <svg class="icon-svg sm" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                </button>
            </div>
        </div>

        <!-- Instagram -->
        <div class="account-card">
            <div class="account-icon-wrap ig-bg">
                <svg class="icon-svg xl" viewBox="0 0 24 24">
                    <rect x="2" y="2" width="20" height="20" rx="5"></rect>
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="17.5" y1="6.5" x2="17.51" y2="6.5" style="stroke-width:2;"></line>
                </svg>
            </div>
            <div class="account-platform">Instagram</div>
            <div class="account-status disconnected" id="ig-status">Not connected</div>
            <div id="ig-username-display" style="font-size:13px;color:var(--text-secondary);margin-bottom:12px;display:none;"></div>
            <div class="form-group" style="text-align:left;">
                <label>Username</label>
                <input type="text" class="form-input" id="ig-username" placeholder="Your Instagram username">
            </div>
            <div class="form-group" style="text-align:left;">
                <label>Session ID</label>
                <input type="password" class="form-input" id="ig-session-id" placeholder="Session ID from browser cookies">
            </div>
            <div style="display:flex;gap:8px;">
                <button class="btn btn-primary" id="ig-connect-btn" style="flex:1;" onclick="connectInstagram()">Connect</button>
                <button class="btn btn-secondary" id="ig-test-btn" onclick="testInstagram()" title="Test connection">
                    <svg class="icon-svg sm" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                </button>
                <button class="btn btn-danger" id="ig-disconnect-btn" style="display:none;" onclick="disconnectAccount('instagram')">
                    <svg class="icon-svg sm" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                </button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    let accountsData = {};

    async function loadAccounts() {
        try {
            const data = await api('/api/accounts');
            accountsData = {};

            if (Array.isArray(data)) {
                data.forEach(acc => {
                    accountsData[acc.platform] = acc;
                });
            } else if (data && typeof data === 'object') {
                Object.keys(data).forEach(platform => {
                    accountsData[platform] = data[platform];
                });
            }

            updateAccountUI('youtube', 'yt');
            updateAccountUI('tiktok', 'tt');
            updateAccountUI('instagram', 'ig');
        } catch (e) {
            console.error('Failed to load accounts:', e);
        }
    }

    function updateAccountUI(platform, prefix) {
        const acc = accountsData[platform];
        const statusEl = document.getElementById(`${prefix}-status`);
        const usernameDisplay = document.getElementById(`${prefix}-username-display`);
        const disconnectBtn = document.getElementById(`${prefix}-disconnect-btn`);
        const connectBtn = document.getElementById(`${prefix}-connect-btn`);

        if (acc && acc.connected) {
            statusEl.textContent = 'Connected';
            statusEl.className = 'account-status connected';

            if (usernameDisplay) {
                const username = acc.username || acc.channel_name || '';
                if (username) {
                    usernameDisplay.textContent = `@${username}`;
                    usernameDisplay.style.display = 'block';
                }
            }
            if (disconnectBtn) disconnectBtn.style.display = 'inline-flex';
            if (connectBtn) {
                connectBtn.textContent = 'Update';
            }
        } else {
            statusEl.textContent = 'Not connected';
            statusEl.className = 'account-status disconnected';
            if (usernameDisplay) usernameDisplay.style.display = 'none';
            if (disconnectBtn) disconnectBtn.style.display = 'none';
            if (connectBtn) {
                connectBtn.textContent = 'Connect';
            }
        }
    }

    async function connectYouTube() {
        const key = document.getElementById('yt-api-key').value.trim();
        if (!key) return showToast('Enter API key', 'error');
        const channelUrl = document.getElementById('yt-channel-url').value.trim();

        const btn = document.getElementById('yt-connect-btn');
        btn.setAttribute('data-loading', 'true');
        btn.disabled = true;
        try {
            const payload = { api_key: key };
            if (channelUrl) payload.channel_url = channelUrl;

            const res = await api('/api/accounts/youtube/connect', 'POST', payload);
            if (res) showToast('YouTube connected!', 'success');
            loadAccounts();
        } catch (e) {
            showToast('Failed to connect YouTube', 'error');
        } finally {
            btn.removeAttribute('data-loading');
            btn.disabled = false;
        }
    }

    async function connectTikTok() {
        const username = document.getElementById('tt-username').value.trim();
        const sessionId = document.getElementById('tt-session-id').value.trim();
        if (!username) return showToast('Enter username', 'error');
        if (!sessionId) return showToast('Enter session ID', 'error');

        const btn = document.getElementById('tt-connect-btn');
        btn.setAttribute('data-loading', 'true');
        btn.disabled = true;
        try {
            const res = await api('/api/accounts/tiktok/connect', 'POST', { username, session_id: sessionId });
            if (res) showToast('TikTok connected!', 'success');
            loadAccounts();
        } catch (e) {
            showToast('Failed to connect TikTok', 'error');
        } finally {
            btn.removeAttribute('data-loading');
            btn.disabled = false;
        }
    }

    async function connectInstagram() {
        const username = document.getElementById('ig-username').value.trim();
        const sessionId = document.getElementById('ig-session-id').value.trim();
        if (!username) return showToast('Enter username', 'error');
        if (!sessionId) return showToast('Enter session ID', 'error');

        const btn = document.getElementById('ig-connect-btn');
        btn.setAttribute('data-loading', 'true');
        btn.disabled = true;
        try {
            const res = await api('/api/accounts/instagram/connect', 'POST', { username, session_id: sessionId });
            if (res) showToast('Instagram connected!', 'success');
            loadAccounts();
        } catch (e) {
            showToast('Failed to connect Instagram', 'error');
        } finally {
            btn.removeAttribute('data-loading');
            btn.disabled = false;
        }
    }

    async function testYouTube() {
        const key = document.getElementById('yt-api-key').value.trim();
        if (!key) return showToast('Enter API key first', 'error');

        const btn = document.getElementById('yt-test-btn');
        btn.setAttribute('data-loading', 'true');
        btn.disabled = true;
        try {
            const res = await api('/api/accounts/youtube/test', 'POST', { api_key: key });
            if (res && res.valid) {
                showToast('YouTube API key is valid!', 'success');
            } else {
                showToast('Invalid API key: ' + (res?.error || 'Unknown error'), 'error');
            }
        } catch (e) {
            showToast('Failed to test connection', 'error');
        } finally {
            btn.removeAttribute('data-loading');
            btn.disabled = false;
        }
    }

    async function testTikTok() {
        const username = document.getElementById('tt-username').value.trim();
        const sessionId = document.getElementById('tt-session-id').value.trim();
        if (!username || !sessionId) return showToast('Enter username and session ID first', 'error');

        const btn = document.getElementById('tt-test-btn');
        btn.setAttribute('data-loading', 'true');
        btn.disabled = true;
        try {
            const res = await api('/api/accounts/tiktok/test', 'POST', { username, session_id: sessionId });
            if (res && res.valid) {
                showToast('TikTok connection valid!', 'success');
            } else {
                showToast('Invalid credentials: ' + (res?.error || 'Unknown error'), 'error');
            }
        } catch (e) {
            showToast('Failed to test connection', 'error');
        } finally {
            btn.removeAttribute('data-loading');
            btn.disabled = false;
        }
    }

    async function testInstagram() {
        const username = document.getElementById('ig-username').value.trim();
        const sessionId = document.getElementById('ig-session-id').value.trim();
        if (!username || !sessionId) return showToast('Enter username and session ID first', 'error');

        const btn = document.getElementById('ig-test-btn');
        btn.setAttribute('data-loading', 'true');
        btn.disabled = true;
        try {
            const res = await api('/api/accounts/instagram/test', 'POST', { username, session_id: sessionId });
            if (res && res.valid) {
                showToast('Instagram connection valid!', 'success');
            } else {
                showToast('Invalid credentials: ' + (res?.error || 'Unknown error'), 'error');
            }
        } catch (e) {
            showToast('Failed to test connection', 'error');
        } finally {
            btn.removeAttribute('data-loading');
            btn.disabled = false;
        }
    }

    async function disconnectAccount(platform) {
        if (!confirm(`Disconnect ${platform}?`)) return;
        try {
            await api(`/api/accounts/${platform}/disconnect`, 'POST');
            showToast(`${platform} disconnected`, 'info');
            loadAccounts();
        } catch (e) {
            showToast(`Failed to disconnect ${platform}`, 'error');
        }
    }

    loadAccounts();
</script>
{% endblock %}

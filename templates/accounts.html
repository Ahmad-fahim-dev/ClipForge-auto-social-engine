{% extends "base.html" %}
{% block title %}ClipForge — Accounts{% endblock %}

{% block content %}
<div class="top-bar">
    <div>
        <div class="page-title">Connected Accounts</div>
        <div class="page-subtitle">Link your social media accounts for auto-posting</div>
    </div>
</div>

<div class="page-content">
    <div class="account-grid" id="account-list">
        <!-- YouTube -->
        <div class="account-card">
            <div class="account-icon-wrap yt-bg">
                <svg class="icon-svg xl" viewBox="0 0 24 24" style="fill:currentColor;stroke:none;">
                    <path
                        d="M23.5 6.19a3 3 0 0 0-2.12-2.12C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.38.57A3 3 0 0 0 .5 6.19 31.3 31.3 0 0 0 0 12a31.3 31.3 0 0 0 .5 5.81 3 3 0 0 0 2.12 2.12C4.5 20.5 12 20.5 12 20.5s7.5 0 9.38-.57a3 3 0 0 0 2.12-2.12A31.3 31.3 0 0 0 24 12a31.3 31.3 0 0 0-.5-5.81zM9.75 15.02V8.98L15.5 12l-5.75 3.02z" />
                </svg>
            </div>
            <div class="account-platform">YouTube</div>
            <div class="account-status disconnected" id="yt-status">Not connected</div>
            <div class="form-group" style="text-align:left;">
                <label>API Key</label>
                <input type="password" class="form-input" id="yt-api-key" placeholder="YouTube Data API v3 key">
            </div>
            <button class="btn btn-primary" style="width:100%;" onclick="connectYouTube()">Connect Account</button>
        </div>

        <!-- TikTok -->
        <div class="account-card">
            <div class="account-icon-wrap tt-bg">
                <svg class="icon-svg xl" viewBox="0 0 24 24" style="fill:currentColor;stroke:none;">
                    <path
                        d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-2.88 2.5 2.89 2.89 0 0 1-2.89-2.89 2.89 2.89 0 0 1 2.89-2.89c.28 0 .55.04.81.1v-3.49a6.37 6.37 0 0 0-.81-.05A6.34 6.34 0 0 0 3.15 15a6.34 6.34 0 0 0 6.34 6.34 6.34 6.34 0 0 0 6.34-6.34V8.68a8.2 8.2 0 0 0 4.76 1.52v-3.45a4.83 4.83 0 0 1-1-.06z" />
                </svg>
            </div>
            <div class="account-platform">TikTok</div>
            <div class="account-status disconnected" id="tt-status">Not connected</div>
            <div class="form-group" style="text-align:left;">
                <label>Username</label>
                <input type="text" class="form-input" id="tt-username" placeholder="Your TikTok username">
            </div>
            <button class="btn btn-purple" style="width:100%;" onclick="connectTikTok()">Connect Account</button>
        </div>

        <!-- Instagram -->
        <div class="account-card">
            <div class="account-icon-wrap ig-bg">
                <svg class="icon-svg xl" viewBox="0 0 24 24">
                    <rect x="2" y="2" width="20" height="20" rx="5" />
                    <circle cx="12" cy="12" r="5" />
                    <line x1="17.5" y1="6.5" x2="17.51" y2="6.5" style="stroke-width:2;" />
                </svg>
            </div>
            <div class="account-platform">Instagram</div>
            <div class="account-status disconnected" id="ig-status">Not connected</div>
            <div class="form-group" style="text-align:left;">
                <label>Username</label>
                <input type="text" class="form-input" id="ig-username" placeholder="Your Instagram username">
            </div>
            <button class="btn btn-primary" style="width:100%;" onclick="connectInstagram()">Connect Account</button>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    async function loadAccounts() {
        const data = await api('/api/accounts');
        if (!data) return;
        data.forEach(acc => {
            const el = document.getElementById(`${acc.platform.substring(0, 2)}-status`);
            if (el) {
                el.textContent = acc.connected ? 'Connected' : 'Not connected';
                el.className = `account-status ${acc.connected ? 'connected' : 'disconnected'}`;
            }
        });
    }

    async function connectYouTube() {
        const key = document.getElementById('yt-api-key').value.trim();
        if (!key) return showToast('Enter API key', 'error');
        const res = await api('/api/accounts', 'POST', { platform: 'youtube', credentials: { api_key: key } });
        if (res) showToast('YouTube connected!', 'success');
        loadAccounts();
    }

    async function connectTikTok() {
        const username = document.getElementById('tt-username').value.trim();
        if (!username) return showToast('Enter username', 'error');
        const res = await api('/api/accounts', 'POST', { platform: 'tiktok', credentials: { username } });
        if (res) showToast('TikTok connected!', 'success');
        loadAccounts();
    }

    async function connectInstagram() {
        const username = document.getElementById('ig-username').value.trim();
        if (!username) return showToast('Enter username', 'error');
        const res = await api('/api/accounts', 'POST', { platform: 'instagram', credentials: { username } });
        if (res) showToast('Instagram connected!', 'success');
        loadAccounts();
    }

    loadAccounts();
</script>
{% endblock %}
